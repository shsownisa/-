<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>قناص الثنائيات 🎯</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: #000;
            color: #fff;
            margin: 0;
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: #00ffcc; text-shadow: 0 0 10px #00ffcc; font-size: 22px; }

        .status-bar {
            font-size: 14px;
            color: #888;
            margin-bottom: 10px;
        }

        input#questionInput {
            width: 100%;
            padding: 15px;
            background: #111;
            border: 2px solid #222;
            border-radius: 15px;
            color: #fff;
            font-size: 18px;
            text-align: center;
            margin-bottom: 30px;
            outline: none;
        }

        .slots-box {
            display: flex;
            align-items: center;
            width: 100%;
            gap: 10px;
            margin-bottom: 40px;
        }

        .name-slot {
            flex: 1;
            height: 110px;
            background: #111;
            border: 2px dashed #333;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-weight: bold;
            font-size: 19px;
            padding: 10px;
            color: #00ffcc;
        }

        .vs {
            background: #ff3e3e;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            box-shadow: 0 0 15px #ff3e3e;
        }

        #spinBtn {
            width: 100%;
            padding: 20px;
            background: #00ffcc;
            color: #000;
            border: none;
            border-radius: 50px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
        }

        #spinBtn:disabled { background: #333; color: #666; box-shadow: none; }

        /* Modal */
        #modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-card {
            background: #1a1a1a;
            padding: 40px;
            border-radius: 30px;
            border: 1px solid #00ffcc;
            text-align: center;
            width: 85%;
            max-width: 350px;
        }
        .winner-text { font-size: 28px; font-weight: bold; color: #fff; margin: 20px 0; }
        .q-final { color: #00ffcc; font-size: 18px; }
        .reset-link { color: #ff3e3e; margin-top: 20px; cursor: pointer; text-decoration: underline; display: block; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎯 قناص الثنائيات</h1>
    <div class="status-bar" id="status">الطلاب المتبقين: 33</div>

    <input type="text" id="questionInput" placeholder="أكثر اثنين شنو؟" value="">

    <div class="slots-box">
        <div class="name-slot" id="s1">؟</div>
        <div class="vs">و</div>
        <div class="name-slot" id="s2">؟</div>
    </div>

    <button id="spinBtn" onclick="pickDuo()">كشف الثنائي 🚀</button>
</div>

<div id="modal">
    <div class="modal-card">
        <div class="q-final" id="modalQ"></div>
        <div class="winner-text" id="modalWinners"></div>
        <button onclick="closeModal()" style="padding: 10px 30px; border-radius: 10px; border:none; background:#00ffcc; font-weight:bold;">تم القصف 😂</button>
        <span class="reset-link" onclick="resetPool()">إعادة تصفير القائمة</span>
    </div>
</div>

<script>
    let originalNames = [
        "بهاء علاء جبار", "بتول علي غازي", "بدور سعد علي", "مريم علي عبد المجيد",
        "بنين جواد كاظم", "بنين علاء عاشور", "بيداء علي جاسب", "تبارك علي",
        "تبارك عماد عمار", "تبارك نجم عبد", "تقى احمد جواد", "تقى طه عبد الحميد",
        "تيسير سراج منير", "جاسم جواد كاظم", "جعفر براهيم عواد", "جمانه قصي براهيم",
        "جنات عامر سهيل", "حسن اسماعيل عبد", "حسن سامي شلش", "حسين جاسم سعدون",
        "حسين زياد نوماس", "حسين محمد صادق", "حوراء جمال صادق", "طيبة هادي جواد",
        "سجى محمد جبير", "بنين عادل سعيد", "رانيا عمار", "مريام احمد كطن",
        "سعد عدنان عبدالله", "عبدالله عامر شيرين", "سفانة امجد عبدالعالي",
        "سارة فلاح مجيد", "طيبة خالد"
    ];

    let pool = [...originalNames];

    function updateStatus() {
        document.getElementById('status').innerText = `الطلاب المتبقين في القرعة: ${pool.length}`;
        if (pool.length < 2) {
            document.getElementById('spinBtn').innerText = "انتهى الطلاب! (صفر القائمة)";
        }
    }

    function pickDuo() {
        const q = document.getElementById('questionInput').value;
        if (pool.length < 2) return alert("خلصوا الطلاب! اضغط إعادة تصفير القائمة.");

        const btn = document.getElementById('spinBtn');
        btn.disabled = true;

        // خلط القائمة بعشوائية 100% (Fisher-Yates)
        for (let i = pool.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [pool[i], pool[j]] = [pool[j], pool[i]];
        }

        let counter = 0;
        const anim = setInterval(() => {
            document.getElementById('s1').innerText = originalNames[Math.floor(Math.random() * originalNames.length)];
            document.getElementById('s2').innerText = originalNames[Math.floor(Math.random() * originalNames.length)];
            counter++;
            if (counter > 30) {
                clearInterval(anim);
                // سحب آخر اسمين من القائمة المخلطة (لضمان عدم التكرار)
                const w1 = pool.pop();
                const w2 = pool.pop();
                
                document.getElementById('s1').innerText = w1;
                document.getElementById('s2').innerText = w2;
                
                setTimeout(() => {
                    document.getElementById('modalQ').innerText = "أكثر اثنين " + q;
                    document.getElementById('modalWinners').innerText = w1 + " و " + w2;
                    document.getElementById('modal').style.display = 'flex';
                    btn.disabled = false;
                    updateStatus();
                }, 500);
            }
        }, 60);
    }

    function resetPool() {
        pool = [...originalNames];
        updateStatus();
        document.getElementById('spinBtn').innerText = "كشف الثنائي 🚀";
        closeModal();
        alert("تم إعادة الجميع للقرعة!");
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; }
    updateStatus();
</script>

</body>
</html>
