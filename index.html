<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام كشف الكذب الاحترافي 🔍</title>
    <style>
        :root {
            --neon-green: #00ff9f;
            --neon-red: #ff0055;
            --dark-bg: #0d1117;
            --card-bg: #161b22;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--dark-bg);
            color: #ffffff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            padding: 30px 20px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid #30363d;
            text-align: center;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 25px;
            color: var(--neon-green);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .input-group {
            margin-bottom: 25px;
        }

        select {
            width: 100%;
            padding: 12px;
            background: #0d1117;
            border: 2px solid #30363d;
            border-radius: 12px;
            color: #c9d1d9;
            font-size: 16px;
            outline: none;
            cursor: pointer;
        }

        /* منطقة البصمة */
        .scanner-wrapper {
            position: relative;
            width: 160px;
            height: 200px;
            margin: 0 auto 20px;
            background: #0d1117;
            border: 2px solid #30363d;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: 0.3s;
        }

        .scanner-wrapper.active {
            border-color: var(--neon-green);
            box-shadow: 0 0 20px rgba(0, 255, 159, 0.2);
        }

        .fingerprint-icon {
            font-size: 80px;
            opacity: 0.2;
            transition: 0.3s;
        }

        .active .fingerprint-icon {
            opacity: 0.8;
            filter: drop-shadow(0 0 10px var(--neon-green));
        }

        /* خط المسح النيوني */
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--neon-green);
            box-shadow: 0 0 15px var(--neon-green);
            display: none;
            z-index: 10;
        }

        .scanning .scan-line {
            display: block;
            animation: scanAnim 1.5s infinite ease-in-out;
        }

        @keyframes scanAnim {
            0% { top: 5%; }
            50% { top: 90%; }
            100% { top: 5%; }
        }

        .status-msg {
            height: 20px;
            font-size: 14px;
            color: #8b949e;
            margin-bottom: 20px;
        }

        /* النتيجة */
        .result-display {
            font-size: 32px;
            font-weight: 800;
            padding: 15px;
            border-radius: 15px;
            display: none;
            animation: resultPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes resultPop {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .truth { color: var(--neon-green); border: 2px solid var(--neon-green); background: rgba(0, 255, 159, 0.05); }
        .lie { color: var(--neon-red); border: 2px solid var(--neon-red); background: rgba(255, 0, 85, 0.05); }

    </style>
</head>
<body>

<div class="app-container">
    <h1>DETECTIVE AI • نظام الكشف</h1>

    <div class="input-group">
        <select id="studentName">
            <option value="">اختر اسم الطالب فحص...</option>
            </select>
    </div>

    <div class="scanner-wrapper" id="scanner">
        <div class="scan-line"></div>
        <div class="fingerprint-icon">☝️</div>
    </div>

    <div class="status-msg" id="status">جاهز لتحليل البيانات...</div>

    <div id="resultBox" class="result-display"></div>
</div>

<script>
    const students = [
        "بهاء علاء جبار", "بتول علي غازي", "بدور سعد علي", "مريم علي عبد المجيد",
        "بنين جواد كاظم", "بنين علاء عاشور", "بيداء علي جاسب", "تبارك علي",
        "تبارك عماد عمار", "تبارك نجم عبد", "تقى احمد جواد", "تقى طه عبد الحميد",
        "تيسير سراج منير", "جاسم جواد كاظم", "جعفر براهيم عواد", "جمانه قصي براهيم",
        "جنات عامر سهيل", "حسن اسماعيل عبد", "حسن سامي شلش", "حسين جاسم سعدون",
        "حسين زياد نوماس", "حسين محمد صادق", "حوراء جمال صادق", "طيبة هادي جواد",
        "سجى محمد جبير", "بنين عادل سعيد", "رانيا عمار", "مريام احمد كطن",
        "سعد عدنان عبدالله", "عبدالله عامر شيرين", "سفانة امجد عبدالعالي",
        "سارة فلاح مجيد", "طيبة خالد"
    ];

    const select = document.getElementById('studentName');
    const scanner = document.getElementById('scanner');
    const status = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');

    // تعبئة الأسماء
    students.forEach(name => {
        let opt = document.createElement('option');
        opt.value = name;
        opt.innerText = name;
        select.appendChild(opt);
    });

    let holdTimer;

    // أحداث اللمس والضغط
    const startAction = (e) => {
        e.preventDefault();
        if(!select.value) {
            status.innerText = "❌ يرجى اختيار اسم أولاً!";
            status.style.color = "#ff4444";
            return;
        }

        resultBox.style.display = 'none';
        scanner.classList.add('active', 'scanning');
        status.innerText = "جاري تحليل الموجات الحيوية...";
        status.style.color = "#8b949e";

        holdTimer = setTimeout(() => {
            finishScan();
        }, 2500);
    };

    const stopAction = () => {
        clearTimeout(holdTimer);
        if(!resultBox.style.display || resultBox.style.display === 'none') {
            scanner.classList.remove('active', 'scanning');
            status.innerText = "⚠️ فشل الفحص! استمر بالضغط";
        }
    };

    scanner.addEventListener('mousedown', startAction);
    scanner.addEventListener('touchstart', startAction);
    window.addEventListener('mouseup', stopAction);
    window.addEventListener('touchend', stopAction);

    function finishScan() {
        scanner.classList.remove('scanning');
        const isTruth = Math.random() > 0.5; // عشوائية 100%
        
        resultBox.style.display = 'block';
        if(isTruth) {
            resultBox.innerText = "صـادق ✅";
            resultBox.className = "result-display truth";
            status.innerText = "تم التحقق من صدق: " + select.value;
        } else {
            resultBox.innerText = "كـاذب ❌";
            resultBox.className = "result-display lie";
            status.innerText = "كشف محاولة تضليل من: " + select.value;
        }
    }
</script>

</body>
</html>
