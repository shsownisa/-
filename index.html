<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بث مباشر - MBC العراق</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            background-color: #0f0f0f;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 800px;
            text-align: center;
        }

        video {
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background-color: black;
        }

        .header {
            margin-bottom: 20px;
        }

        .footer {
            margin-top: 20px;
            font-size: 1.2rem;
            color: #ff0000;
            font-weight: bold;
            text-shadow: 1px 1px 5px rgba(255,0,0,0.3);
        }

        .badge {
            background-color: #e31212;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="badge">بث مباشر</div>
            <h2>مشغل قناة MBC العراق</h2>
        </div>

        <video id="video" controls autoplay playsinline></video>

        <div class="footer">
            بث عبود
        </div>
    </div>

    <script>
        var video = document.getElementById('video');
        var videoSrc = 'http://89.149.221.167:8080/live/ahmed112233/112233ahmed/99365.m3u8?token=QWdrTDBJa1hnZDBzd0ZR';

        if (Hls.isSupported()) {
            var hls = new Hls();
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
        }
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoSrc;
        }
    </script>

</body>
</html>
